<nav class="h-16 border-b border-gray-200 bg-white flex items-center justify-between px-6 sticky top-0 z-30">
    <div class="flex items-center gap-4">
        <div class="md:hidden">
            <app-icon name="Menu" className="h-6 w-6 text-gray-600 cursor-pointer"></app-icon>
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
            {{ 'shell.title' | translate }}
        </h1>
    </div>

    <div class="flex items-center gap-6">
        <div class="flex items-center gap-2 bg-gray-50 border border-gray-200 rounded-lg p-1">
            <button (click)="languageChange.emit('en')"
                [class]="'px-3 py-1 text-sm font-medium rounded-md transition-colors ' + (currentLang() === 'en' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-900')">
                EN
            </button>
            <button (click)="languageChange.emit('es')"
                [class]="'px-3 py-1 text-sm font-medium rounded-md transition-colors ' + (currentLang() === 'es' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-900')">
                ES
            </button>
        </div>

        <div class="hidden sm:flex flex-col items-end">
            <span class="text-sm font-medium text-gray-900">{{ user()?.name || ('shell.guestName' | translate) }}</span>
            <span class="text-xs text-gray-500">{{ user()?.email || ('shell.guestEmail' | translate) }}</span>
        </div>

        <div class="relative group">
            <button
                class="h-10 w-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold hover:shadow-lg transition-all duration-200 overflow-hidden border-2 border-white">
                <img *ngIf="user()?.avatar; else letterAvatar" [src]="user()?.avatar" [alt]="user()?.name"
                    class="h-full w-full object-cover" />
                <ng-template #letterAvatar>
                    <span>{{ user()?.name?.[0]?.toUpperCase() || 'G' }}</span>
                </ng-template>
            </button>

            <div
                class="absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-xl shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform origin-top-right scale-95 group-hover:scale-100 z-50 py-1">
                <div class="px-4 py-2 border-b border-gray-50">
                    <p class="text-sm font-semibold text-gray-900 line-clamp-1">{{ user()?.name || ('shell.guestName' |
                        translate) }}</p>
                    <p class="text-xs text-gray-500 line-clamp-1">{{ user()?.email || ('shell.guestEmail' | translate)
                        }}</p>
                </div>
                <button
                    class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                    <app-icon name="User" size="16"></app-icon> {{ 'shell.profile' | translate }}
                </button>
                <button
                    class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                    <app-icon name="Settings" size="16"></app-icon> {{ 'shell.settings' | translate }}
                </button>
                <div class="border-t border-gray-50 my-1"></div>
                <button class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
                    <app-icon name="LogOut" size="16"></app-icon> {{ 'shell.signOut' | translate }}
                </button>
            </div>
        </div>
    </div>
</nav>
