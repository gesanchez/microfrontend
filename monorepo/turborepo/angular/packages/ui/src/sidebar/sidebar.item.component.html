<button (click)="onClick.emit()"
    [class]="'w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-all duration-200 group ' + (isActive() ? 'bg-blue-50 text-blue-600 shadow-sm' : 'text-gray-600 hover:bg-gray-50 hover:text-gray-900')">
    <app-icon [name]="icon()" [size]="20"
        [className]="isActive() ? 'text-blue-600' : 'text-gray-400 group-hover:text-gray-600'"></app-icon>
    <span class="font-medium">{{ label() }}</span>
    <div *ngIf="isActive()" class="ml-auto w-1.5 h-1.5 rounded-full bg-blue-600"></div>
</button>
