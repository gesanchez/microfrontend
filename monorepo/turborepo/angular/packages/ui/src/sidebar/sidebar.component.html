<aside class="w-64 h-[calc(100vh-64px)] bg-white border-r border-gray-200 flex flex-col p-4 sticky top-16">
    <div class="flex-1 flex flex-col gap-1">
        <p class="px-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">{{ 'shell.mainMenu' |
            translate }}</p>
        <app-sidebar-item *ngFor="let item of items()" [label]="item.label" [icon]="item.icon"
            [isActive]="currentPath() === item.path" (onClick)="navigate.emit(item.path)"></app-sidebar-item>
    </div>

    <div class="mt-auto border-t border-gray-50 pt-4">
        <button
            class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-500 hover:bg-gray-50 transition-all">
            <app-icon name="CircleQuestionMark" size="20"></app-icon>
            <span class="font-medium text-sm">{{ 'shell.helpSupport' | translate }}</span>
        </button>
    </div>
</aside>
